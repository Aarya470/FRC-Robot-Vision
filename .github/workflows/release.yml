name: Release

# Runs when you push a tag like v1.0.0. Builds the library, publishes it to GitHub Pages
# (where WPILib downloads it from), and makes a GitHub release with the notes from CHANGELOG.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SITE_URL: https://aarya470.github.io/FRC-Robot-Vision

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Read the version from the tag
        id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! grep -qx "## $V" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $V' section. Add the release notes for $V first."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build, test and publish to a local folder
        run: |
          chmod +x gradlew
          ./gradlew build publish -PreleaseVersion=${{ steps.v.outputs.version }}

      - name: Make the vendordep site
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p site/repo
          cp -r build/repo/. site/repo/
          cat > site/MercuryVision.json <<JSON
          {
              "fileName": "MercuryVision.json",
              "name": "MercuryVision",
              "version": "${VERSION}",
              "uuid": "50204a77-2ba9-4771-92b3-6e5c6cfebc4c",
              "frcYear": "2026",
              "mavenUrls": [
                  "${SITE_URL}/repo"
              ],
              "jsonUrl": "${SITE_URL}/MercuryVision.json",
              "javaDependencies": [
                  {
                      "groupId": "io.github.aarya470",
                      "artifactId": "MercuryVision-java",
                      "version": "${VERSION}"
                  }
              ],
              "jniDependencies": [],
              "cppDependencies": []
          }
          JSON
          python3 -m json.tool site/MercuryVision.json > /dev/null
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://github.com/${GITHUB_REPOSITORY}">
          <title>Mercury Vision</title></head>
          <body><a href="https://github.com/${GITHUB_REPOSITORY}">Mercury Vision</a></body></html>
          HTML

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true

      - name: Write release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          v = os.environ["VERSION"]
          site = os.environ["SITE_URL"]
          notes, inside = [], False
          for line in open("CHANGELOG.md", encoding="utf-8").read().splitlines():
              if line.startswith("## "):
                  if inside:
                      break
                  inside = line[3:].strip() == v
                  continue
              if inside:
                  notes.append(line)
          body = "## What's new\n\n" + "\n".join(notes).strip() + "\n\n"
          body += "## Install\n\n"
          body += "In WPILib VS Code, run **WPILib: Manage Vendor Libraries > Install new libraries (online)** and paste:\n\n"
          body += "```\n" + site + "/MercuryVision.json\n```\n"
          open("notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cp site/MercuryVision.json .
          gh release create "v${VERSION}" --title "Mercury Vision ${VERSION}" --notes-file notes.md --verify-tag 2>/dev/null             || gh release edit "v${VERSION}" --title "Mercury Vision ${VERSION}" --notes-file notes.md
          gh release upload "v${VERSION}" MercuryVision.json build/libs/*.jar --clobber
