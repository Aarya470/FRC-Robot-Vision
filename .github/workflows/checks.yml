name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build
